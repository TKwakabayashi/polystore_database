# staticcheck 設定（CI 用）。
#
# 方針: 正確性系（SA*）は有効のまま、既存コードに広く出るスタイル系と、
# 将来使う scaffolding（未使用フィールド/関数）は除外して緑のベースラインを保つ。
#
#   -U1000  将来使う未使用フィールド/関数を残す方針（memory: keep WIP dead code）。
#   -ST1005 エラー文字列の大文字始まり（日本語メッセージ混在で広範・非本質）。
#   -ST1003 命名規約（既存の識別子命名に多数該当）。
#   -ST1000 パッケージコメントの形式。
#   -ST1020/-ST1021/-ST1022 exported 宣言の doc コメントを識別子名で始める規約
#     （本リポジトリは日本語 doc コメントを多用するため一律除外）。
#
# 生成コード（parser/output/*: `// Code generated ... DO NOT EDIT.`）は staticcheck が自動スキップする。
checks = ["all", "-U1000", "-ST1005", "-ST1003", "-ST1000", "-ST1020", "-ST1021", "-ST1022"]
